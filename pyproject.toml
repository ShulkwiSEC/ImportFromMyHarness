[project]
name = "importfrommyharness"
version = "0.1.3"
description = "Move a large AI-coding harness setup into another harness, with a written list of what did not convert"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["opencode", "claude-code", "migration", "ai-coding", "agents", "mcp"]
authors = [
    { name = "shulkwisec" }
]
requires-python = ">=3.12"
dependencies = ["pyyaml>=6"]

[project.scripts]
importfrommyharness = "importfrommyharness:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[project.urls]
Homepage = "https://github.com/ShulkwiSEC/ImportFromMyHarness"
Issues = "https://github.com/ShulkwiSEC/ImportFromMyHarness/issues"
